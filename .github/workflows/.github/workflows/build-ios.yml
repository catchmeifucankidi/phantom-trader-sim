name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate iOS project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean

      - name: Find workspace and scheme
        working-directory: apps/mobile
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"

          SCHEME=$(xcodebuild \
            -workspace "$WORKSPACE" \
            -list \
            -json | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

      - name: Build unsigned iPhone app
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Create IPA
        working-directory: apps/mobile
        run: |
          APP=$(find build/Build/Products/Release-iphoneos \
            -maxdepth 1 -name "*.app" | head -1)

          echo "Found app: $APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry WalletUIDemo-unsigned.ipa Payload

          ls -lh WalletUIDemo-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalletUIDemo-unsigned
          path: apps/mobile/WalletUIDemo-unsigned.ipa
